<!-- @dsCard group="Colors" viewport="700x110" name="Core Palette" subtitle="Ink, dusk, moss and parchment — text, surfaces, deep sections" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans)}.row{display:flex;height:90px}.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;box-sizing:border-box}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--ink);color:var(--parchment)">ink #1a120c</div>
<div class="sw" style="background:var(--dusk);color:var(--parchment)">dusk #3a281c</div>
<div class="sw" style="background:var(--moss);color:var(--parchment)">moss #6b5344</div>
<div class="sw" style="background:var(--surface-fill);color:var(--ink)">surface-fill #e7d6bd</div>
<div class="sw" style="background:var(--surface-sunken);color:var(--ink)">sunken #e8dcc9</div>
<div class="sw" style="background:var(--parchment);color:var(--ink);border:1px solid var(--border-default)">parchment #f7ecd8</div>
</div></body></html>

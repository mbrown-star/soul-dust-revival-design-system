<!-- @dsCard group="Brand" viewport="700x150" name="Borders & Radius" subtitle="Flat, border-based system — shadows are almost never used" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);font-size:12px;color:var(--text-secondary);padding:20px;box-sizing:border-box;display:flex;gap:16px}.box{width:120px;height:80px;background:var(--surface-page);display:flex;align-items:center;justify-content:center}</style></head>
<body>
<div class="box" style="border:1px solid var(--border-default);border-radius:var(--radius-sm)">radius-sm 4px</div>
<div class="box" style="border:1px solid var(--border-default);border-radius:var(--radius-md)">radius-md 8px</div>
<div class="box" style="border:1px solid var(--border-default);border-radius:var(--radius-full);width:80px">full</div>
<div class="box" style="border:1px solid var(--border-default);box-shadow:var(--shadow-popover)">popover shadow (rare)</div>
</body></html>

<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans)}.row{display:flex;height:90px}.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;box-sizing:border-box;color:var(--ink)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--ember)">ember #e2762c · 2.62:1 on parchment</div>
<div class="sw" style="background:var(--ember-700);color:var(--parchment)">ember-700 #b8501f · accent text (large)</div>
<div class="sw" style="background:var(--gold)">gold #f6c453 · 1.39:1 on parchment</div>
<div class="sw" style="background:linear-gradient(90deg,var(--ember),var(--gold))">ember → gold (wordmark, hero)</div>
</div></body></html>

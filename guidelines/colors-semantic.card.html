<!-- @dsCard group="Colors" viewport="700x110" name="Semantic States" subtitle="Error, warning, success — used sparingly, as plain text not badges" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:system-ui}.row{display:flex;height:90px}.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;box-sizing:border-box}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--state-error)">error #dc2626</div>
<div class="sw" style="background:var(--state-warning)">warning #b45309</div>
<div class="sw" style="background:var(--state-success)">success #15803d</div>
</div></body></html>

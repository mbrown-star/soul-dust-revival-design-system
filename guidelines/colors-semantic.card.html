<!-- @dsCard group="Colors" viewport="700x110" name="Semantic States" subtitle="Error, warning, success — used sparingly, as plain text not badges" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans)}.row{display:flex;height:90px}.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;box-sizing:border-box}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--state-error);color:var(--ink)">error → ember #e2762c</div>
<div class="sw" style="background:var(--state-warning)">warning #8d6407 (inferred)</div>
<div class="sw" style="background:var(--state-success)">success #3b5a2b (inferred)</div>
</div></body></html>

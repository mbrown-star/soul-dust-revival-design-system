<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px-based scale used across all padding/gap in source" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary);padding:20px;box-sizing:border-box}.row{display:flex;align-items:center;gap:10px;margin-bottom:6px}.bar{background:var(--neutral-900);height:10px}</style></head>
<body>
<div class="row"><div class="bar" style="width:var(--space-1)"></div>4px</div>
<div class="row"><div class="bar" style="width:var(--space-2)"></div>8px</div>
<div class="row"><div class="bar" style="width:var(--space-3)"></div>12px</div>
<div class="row"><div class="bar" style="width:var(--space-4)"></div>16px</div>
<div class="row"><div class="bar" style="width:var(--space-6)"></div>24px</div>
<div class="row"><div class="bar" style="width:var(--space-8)"></div>32px</div>
<div class="row"><div class="bar" style="width:var(--space-12)"></div>48px</div>
<div class="row"><div class="bar" style="width:var(--space-20)"></div>80px</div>
</body></html>

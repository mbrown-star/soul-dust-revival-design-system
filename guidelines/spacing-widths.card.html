<!-- @dsCard group="Spacing" viewport="700x150" name="Content Widths" subtitle="Narrow centered columns per screen type — never full-bleed text" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;align-items:center}.bar{background:var(--surface-fill);border:1px solid var(--border-default);height:16px;display:flex;align-items:center;padding-left:6px;box-sizing:border-box}</style></head>
<body>
<div class="bar" style="width:var(--content-sm)">24rem — login</div>
<div class="bar" style="width:var(--content-lg)">36rem — checkout / success</div>
<div class="bar" style="width:var(--content-xl)">42rem — lesson reading column</div>
<div class="bar" style="width:var(--content-2xl)">56rem — admin shell</div>
</body></html>

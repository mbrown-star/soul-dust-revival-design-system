<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff;font-family:system-ui}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Button, ColorPicker } = (window.__DS || (window.__DS = Object.keys(window).filter(k=>/DesignSystem/.test(k)).map(k=>window[k]).find(o=>o&&o.Button)||{}));
function Demo(){
  const [color,setColor]=React.useState("#fef3c7");
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,maxWidth:660}}>
      <Input label="Title" id="t1" required value="Week 1: Beginnings" onChange={()=>{}} />
      <Input label="Alt text" id="t2" required error="Alt text is required whenever an image is attached (WCAG 1.1.1)." value="" onChange={()=>{}} />
      <Textarea label="Description" id="t3" rows={3} value="A four-week study on new beginnings." onChange={()=>{}} />
      <div style={{display:"flex",gap:16}}>
        <Select label="Format" options={[{value:"physical",label:"Physical (ships)"},{value:"digital",label:"Digital / web app access"}]} value="digital" onChange={()=>{}} />
        <Checkbox id="c1" label="Published" checked={true} onChange={()=>{}} />
      </div>
      <div>
        <p style={{fontSize:14,fontWeight:500,margin:"0 0 4px"}}>Callout background color</p>
        <ColorPicker value={color} onChange={setColor} />
      </div>
      <div style={{display:"flex",gap:12}}>
        <Button>Save study</Button>
        <Button variant="secondary">Cancel</Button>
        <Button disabled>Saving...</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>

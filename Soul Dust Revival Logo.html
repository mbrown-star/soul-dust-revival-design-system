<!DOCTYPE html><html><head><meta charset="utf-8"><title>Soul Dust Revival — Logo Variations</title>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,sans-serif}
.frame{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center}
.label{position:absolute;font-size:12px;color:#8a8a8a;font-family:system-ui,sans-serif;letter-spacing:.04em}
.word{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;line-height:.92;text-align:center;background:linear-gradient(90deg,#f6c453 0%,#e2762c 55%,#b8501f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{background:#f6c453;height:3px;border-radius:2px}
.scripture{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:#f7ecd8;letter-spacing:.03em}
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid;background:#1a120c}
.badge span{font-family:'Anton',sans-serif;color:#f6c453}
</style></head>
<body>

<div class="label" style="left:80px;top:40px">A — Wordmark only, stacked, on ink</div>
<div class="frame" style="left:80px;top:70px;width:640px;height:400px;background:#1a120c;border-radius:28px;gap:20px">
<div class="word" style="font-size:80px">Soul Dust</div>
<div class="word" style="font-size:80px;margin-top:-8px">Revival</div>
<div class="rule" style="width:220px;margin-top:16px"></div>
<div class="scripture" style="font-size:20px;margin-top:14px">Psalm 119:25</div>
</div>

<div class="label" style="left:780px;top:40px">B — Wordmark, single line, on paper</div>
<div class="frame" style="left:780px;top:70px;width:640px;height:400px;background:#f7ecd8;border-radius:28px;gap:14px">
<div class="word" style="font-size:52px;background:linear-gradient(90deg,#b8501f 0%,#8a3a17 100%);-webkit-background-clip:text;background-clip:text;white-space:nowrap">Soul Dust Revival</div>
<div class="rule" style="width:160px;background:#e2762c"></div>
<div class="scripture" style="font-size:18px;color:#3a281c">Psalm 119:25</div>
</div>

<div class="label" style="left:80px;top:520px">C — Monogram badge (SDR)</div>
<div class="frame" style="left:80px;top:550px;width:300px;height:300px">
<div class="badge" style="width:180px;height:180px;border-color:#f6c453"><span style="font-size:64px">SDR</span></div>
</div>

<div class="label" style="left:430px;top:520px">D — Monogram + wordmark lockup</div>
<div class="frame" style="left:430px;top:550px;width:520px;height:300px;background:#1a120c;border-radius:24px;flex-direction:row;gap:24px">
<div class="badge" style="width:96px;height:96px;border-color:#f6c453;flex-shrink:0"><span style="font-size:34px">SDR</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-start">
<div class="word" style="font-size:38px;text-align:left">Soul Dust</div>
<div class="word" style="font-size:38px;text-align:left;margin-top:-4px">Revival</div>
</div>
</div>

<div class="label" style="left:1000px;top:520px">E — Wordmark, no rule, tight kerning</div>
<div class="frame" style="left:1000px;top:550px;width:420px;height:300px;background:#1a120c;border-radius:24px;gap:8px">
<div class="word" style="font-size:44px;letter-spacing:-.01em">Soul Dust</div>
<div class="word" style="font-size:44px;margin-top:-6px;letter-spacing:-.01em">Revival</div>
<div class="scripture" style="font-size:15px;color:#d9c3a3;margin-top:12px">Psalm 119:25 (ESV)</div>
</div>

</body></html>

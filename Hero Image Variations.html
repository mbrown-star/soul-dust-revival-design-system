<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hero Image Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=Source+Serif+4:wght@400&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e5dc;font-family:"Archivo",system-ui,sans-serif;color:#17231f;padding:48px 40px 72px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:30px;margin:0 0 6px}
.lede{font-family:"Source Serif 4",Georgia,serif;font-size:16px;color:#5d5a52;max-width:700px;margin:0 0 40px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:36px}
figure{margin:0}
img{width:100%;display:block;box-shadow:0 10px 28px rgba(23,35,31,.22)}
figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6d6a62}
figcaption em{font-style:normal;text-transform:none;letter-spacing:0;color:#8a867d}
a{color:#b8501f}
a:hover{color:#de3a2e}
</style></head>
<body>

<h1>Hero image variations</h1>
<p class="lede">Fifteen color grades of the homepage hero, each written out as a real PNG in <code>assets/hero-variants/</code> — drop any one straight into the hero's <code>&lt;img class="bg"&gt;</code>. All carry the same brand vignette; the grades pull the photo toward the palette's greens, rusts, golds, and inks.</p>

<div class="list">
<figure><img src="assets/hero-variants/01-original.png" alt="Original grade"><figcaption><span>01 — Original</span><em>Untouched, vignette only</em></figcaption></figure>
<figure><img src="assets/hero-variants/02-dusk-duotone.png" alt="Dusk duotone grade"><figcaption><span>02 — Dusk duotone</span><em>Brand teal; matches the book covers</em></figcaption></figure>
<figure><img src="assets/hero-variants/03-moss-duotone.png" alt="Moss duotone grade"><figcaption><span>03 — Moss duotone</span><em>Lighter green; softer, more open</em></figcaption></figure>
<figure><img src="assets/hero-variants/04-ink-deep.png" alt="Ink deep grade"><figcaption><span>04 — Ink deep</span><em>Darkest option; best for white type</em></figcaption></figure>
<figure><img src="assets/hero-variants/05-rust-warm.png" alt="Rust warm grade"><figcaption><span>05 — Rust warm</span><em>Closest to the original mood, warmer</em></figcaption></figure>
<figure><img src="assets/hero-variants/06-ember-hot.png" alt="Ember hot grade"><figcaption><span>06 — Ember hot</span><em>Saturated; pushes the brand red</em></figcaption></figure>
<figure><img src="assets/hero-variants/07-gold-wash.png" alt="Gold wash grade"><figcaption><span>07 — Gold wash</span><em>Bright, hopeful, low contrast</em></figcaption></figure>
<figure><img src="assets/hero-variants/08-parchment-sepia.png" alt="Parchment sepia grade"><figcaption><span>08 — Parchment sepia</span><em>Archival; pairs with light sections</em></figcaption></figure>
<figure><img src="assets/hero-variants/09-mono-ink.png" alt="Monochrome ink grade"><figcaption><span>09 — Mono ink</span><em>Black &amp; white; type-forward layouts</em></figcaption></figure>
<figure><img src="assets/hero-variants/10-dusty-faded.png" alt="Dusty faded grade"><figcaption><span>10 — Dusty faded</span><em>Washed out; "clings to the dust"</em></figcaption></figure>
<figure><img src="assets/hero-variants/11-high-drama.png" alt="High drama grade"><figcaption><span>11 — High drama</span><em>Hardest contrast; strongest clouds</em></figcaption></figure>
<figure><img src="assets/hero-variants/12-cool-twilight.png" alt="Cool twilight grade"><figcaption><span>12 — Cool twilight</span><em>Blue shift; reads as dusk, not dawn</em></figcaption></figure>
<figure><img src="assets/hero-variants/13-bleached-dawn.png" alt="Bleached dawn grade"><figcaption><span>13 — Bleached dawn</span><em>Lightest; needs dark type</em></figcaption></figure>
<figure><img src="assets/hero-variants/14-night-moss.png" alt="Night moss grade"><figcaption><span>14 — Night moss</span><em>Near-night; heavy scrim built in</em></figcaption></figure>
<figure><img src="assets/hero-variants/15-dust-storm.png" alt="Dust storm grade with grain"><figcaption><span>15 — Dust storm</span><em>Grain added; matches cover mottle</em></figcaption></figure>
</div>
</body></html>
